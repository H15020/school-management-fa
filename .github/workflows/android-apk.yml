name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: دریافت کد پروژه
        uses: actions/checkout@v4

      - name: راه‌اندازی Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: راه‌اندازی Android SDK
        uses: android-actions/setup-android@v3

      - name: نصب ابزارهای Android 35
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: راه‌اندازی Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: ساخت APK آزمایشی
        run: gradle :app:assembleDebug --no-daemon

      - name: انتشار فایل APK به‌عنوان خروجی قابل دریافت
        uses: actions/upload-artifact@v4
        with:
          name: school-management-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
